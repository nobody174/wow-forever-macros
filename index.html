<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venom &amp; Trollmann's Road to Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1428; --panel:#161E38; --edge:#3A4468; --gold:#FFD100;
  --text:#E6E2D6; --muted:#9AA0B8; --accent:#FFD100;
  --serif:"Marcellus","Palatino Linotype",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--edge);flex-wrap:wrap}
.topbar .site-title{font:400 20px/1.1 var(--serif);color:var(--gold);text-decoration:none;letter-spacing:.01em}
.topbar nav{display:flex;gap:8px;flex-wrap:wrap}
.topbar nav a{
  font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;
  color:var(--gold);text-decoration:none;padding:10px 16px;border-radius:6px;
  background:linear-gradient(180deg,#2A335A 0%,#161E38 55%,#10152C 100%);
  border:1px solid var(--edge);border-top-color:#4A5688;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.topbar nav a:hover{
  border-color:var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 10px rgba(255,209,0,.35), 0 2px 4px rgba(0,0,0,.35);
  transform:translateY(-1px);
}
.topbar nav a:active{transform:translateY(0);box-shadow:inset 0 1px 4px rgba(0,0,0,.5)}
.topbar nav a[aria-current="page"]{
  color:#0E1428;background:linear-gradient(180deg,#FFE566 0%,var(--gold) 55%,#C79C00 100%);
  border-color:#FFE566;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 10px rgba(255,209,0,.5);
}
@media (prefers-reduced-motion:reduce){.topbar nav a{transition:none}}

.hero{
  position:relative;
  min-height:calc(100svh - 61px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:8vh 20px 6vh;
  background-image:url("assets/hero.webp");
  background-size:cover;
  background-position:center bottom;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(6,9,20,.88) 0%, rgba(6,9,20,.55) 28%, rgba(6,9,20,.05) 55%, rgba(6,9,20,0) 70%);
  pointer-events:none;
}
.hero-content{position:relative;z-index:1;text-align:center;max-width:900px}
.hero h1{
  font:400 clamp(30px,6vw,58px)/1.15 var(--serif);
  color:var(--gold);
  margin:0 0 28px;
  letter-spacing:.01em;
  text-shadow:0 2px 18px rgba(0,0,0,.65);
}

.countdown{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.countdown .tile{
  background:rgba(14,20,40,.62);
  border:1px solid var(--edge);
  border-radius:8px;
  padding:14px 18px;
  min-width:76px;
  backdrop-filter:blur(2px);
}
.countdown .num{display:block;font:600 clamp(24px,4vw,38px)/1 var(--mono);color:var(--text)}
.countdown .label{display:block;margin-top:6px;font:500 12px/1 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.local-time{color:var(--muted);font-size:14px;margin:0}
.live-msg{font:400 clamp(26px,5vw,42px)/1.2 var(--serif);color:var(--gold);text-shadow:0 2px 18px rgba(0,0,0,.65)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){
  .countdown{gap:8px}
  .countdown .tile{padding:10px 12px;min-width:64px}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="site-title" href="index.html">Venom &amp; Trollmann's Road to Forever</a>
  <nav aria-label="Site">
    <a href="macros.html">Macros</a>
    <a href="builds.html">Builds</a>
    <a href="https://www.zockify.com/forever/talents/" target="_blank" rel="noopener">Talent Calc</a>
  </nav>
</div>

<div class="hero">
  <div class="hero-content">
    <h1>Venom &amp; Trollmann's Road to Forever</h1>
    <div id="countdown" class="countdown" aria-live="polite"></div>
    <p class="local-time" id="local-time"></p>
  </div>
</div>

<script>
const TARGET = new Date("2026-11-04T23:00:00Z");
const countdownEl = document.getElementById("countdown");
const localTimeEl = document.getElementById("local-time");

function renderLocalTime(){
  try{
    const fmt = new Intl.DateTimeFormat(undefined, {
      dateStyle: "full",
      timeStyle: "short"
    });
    localTimeEl.textContent = "Launches " + fmt.format(TARGET) + " your time";
  }catch(e){
    localTimeEl.textContent = "";
  }
}

function tick(){
  const now = new Date();
  const diff = TARGET - now;
  if(diff <= 0){
    countdownEl.innerHTML = `<div class="live-msg">WoW Forever is live!</div>`;
    return;
  }
  const s = Math.floor(diff / 1000);
  const days = Math.floor(s / 86400);
  const hours = Math.floor((s % 86400) / 3600);
  const minutes = Math.floor((s % 3600) / 60);
  const seconds = s % 60;
  const tiles = [
    [days, "Days"],
    [hours, "Hours"],
    [minutes, "Minutes"],
    [seconds, "Seconds"],
  ];
  countdownEl.innerHTML = tiles.map(([n, label]) =>
    `<div class="tile"><span class="num">${String(n).padStart(2,"0")}</span><span class="label">${label}</span></div>`
  ).join("");
}

renderLocalTime();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
