mor", "code": "#showtooltip Sunder Armor\n/cast [@targettarget, harm, exists][harm] Sunder Armor", "note": ""}, {"name": "Execute", "code": "#showtooltip Execute\n/cast [@targettarget, harm, exists][harm] Execute", "note": ""}, {"name": "Overpower (to Battle)", "code": "#showtooltip Overpower\n/cast [nostance:1] Battle Stance; [@targettarget, harm, exists][harm] Overpower", "note": ""}, {"name": "Demoralizing Shout", "code": "#showtooltip Demoralizing Shout\n/cast Demoralizing Shout", "note": ""}, {"name": "Thunder Clap (to Battle)", "code": "#showtooltip Thunder Clap\n/cast [nostance:1] Battle Stance; Thunder Clap", "note": ""}]}, {"type": "Wand / auto-attack", "macros": [{"name": "Auto-attack (spam-safe)", "code": "/startattack [@targettarget, harm, exists][harm]", "note": ""}]}, {"type": "Buffs", "macros": [{"name": "Battle Shout", "code": "#showtooltip Battle Shout\n/cast Battle Shout", "note": ""}, {"name": "Bloodrage", "code": "#showtooltip Bloodrage\n/cast Bloodrage", "note": ""}, {"name": "Berserker Rage (to Berserker)", "code": "#showtooltip Berserker Rage\n/cast [nostance:3] Berserker Stance; Berserker Rage", "note": ""}]}, {"type": "Panic / defensive", "macros": [{"name": "Shield Wall (to Defensive)", "code": "#showtooltip Shield Wall\n/cast [nostance:2] Defensive Stance; Shield Wall", "note": ""}, {"name": "Retaliation (to Battle)", "code": "#showtooltip Retaliation\n/cast [nostance:1] Battle Stance; Retaliation", "note": ""}, {"name": "Intimidating Shout", "code": "#showtooltip Intimidating Shout\n/cast [@targettarget, harm, exists][harm] Intimidating Shout", "note": ""}, {"name": "Disarm (to Defensive)", "code": "#showtooltip Disarm\n/cast [nostance:2] Defensive Stance; [@targettarget, harm, exists][harm] Disarm", "note": ""}]}, {"type": "Class QoL", "macros": [{"name": "Battle Stance", "code": "#showtooltip Battle Stance\n/cast Battle Stance", "note": ""}, {"name": "Defensive Stance", "code": "#showtooltip Defensive Stance\n/cast Defensive Stance", "note": ""}, {"name": "Berserker Stance", "code": "#showtooltip Berserker Stance\n/cast Berserker Stance", "note": ""}, {"name": "Charge / Intercept (one button)", "code": "#showtooltip Charge\n/cast [nocombat, nostance:1] Battle Stance; [nocombat, @targettarget, harm, exists][nocombat, harm] Charge; [nostance:3] Berserker Stance; [@targettarget, harm, exists][harm] Intercept", "note": "Out of combat: Charge. In combat: Intercept. Stance swaps cost rage above your Tactical Mastery cap."}, {"name": "Taunt (to Defensive)", "code": "#showtooltip Taunt\n/cast [nostance:2] Defensive Stance; [@targettarget, harm, exists][harm] Taunt", "note": "Target the friend being hit: TT is the mob."}, {"name": "Mocking Blow (to Battle)", "code": "#showtooltip Mocking Blow\n/cast [nostance:1] Battle Stance; [@targettarget, harm, exists][harm] Mocking Blow", "note": ""}, {"name": "Challenging Shout", "code": "#showtooltip Challenging Shout\n/cast Challenging Shout", "note": ""}]}, {"type": "Cleanse / dispel", "macros": [{"name": "No dispel", "code": "", "note": "Warriors have no dispel. Interrupt instead with Pummel or Shield Bash."}]}, {"type": "Focus", "macros": [{"name": "Pummel focus", "code": "#showtooltip Pummel\n/cast [nostance:3] Berserker Stance; [@focus, harm, exists][harm] Pummel", "note": ""}, {"name": "Shield Bash focus", "code": "#showtooltip Shield Bash\n/cast [@focus, harm, exists][harm] Shield Bash", "note": ""}, {"name": "Taunt focus", "code": "#showtooltip Taunt\n/cast [@focus, harm, exists][harm] Taunt", "note": ""}]}]}, {"spec": "Fury", "groups": [{"type": "TT-aware DPS", "macros": [{"name": "Bloodthirst", "code": "#showtooltip Bloodthirst\n/cast [@targettarget, harm, exists][harm] Bloodthirst", "note": ""}, {"name": "Whirlwind (to Berserker)", "code": "#showtooltip Whirlwind\n/cast [nostance:3] Berserker Stance; Whirlwind", "note": ""}, {"name": "Pummel (to Berserker)", "code": "#showtooltip Pummel\n/cast [nostance:3] Berserker Stance; [@targettarget, harm, exists][harm] Pummel", "note": ""}, {"name": "Slam", "code": "#showtooltip Slam\n/cast [@targettarget, harm, exists][harm] Slam", "note": ""}, {"name": "Piercing Howl", "code": "#showtooltip Piercing Howl\n/cast Piercing Howl", "note": ""}]}, {"type": "Buffs", "macros": [{"name": "Death Wish", "code": "#showtooltip Death Wish\n/cast Death Wish", "note": ""}, {"name": "Recklessness (to Berserker)", "code": "#showtooltip Recklessness\n/cast [nostance:3] Berserker Stance; Recklessness", "note": ""}]}]}, {"spec": "Protection", "groups": [{"type": "TT-aware DPS", "macros": [{"name": "Shield Slam", "code": "#showtooltip Shield Slam\n/cast [@targettarget, harm, exists][harm] Shield Slam", "note": ""}, {"name": "Revenge", "code": "#showtooltip Revenge\n/cast [@targettarget, harm, exists][harm] Revenge", "note": ""}, {"name": "Shield Bash", "code": "#showtooltip Shield Bash\n/cast [@targettarget, harm, exists][harm] Shield Bash", "note": ""}, {"name": "Concussion Blow", "code": "#showtooltip Concussion Blow\n/cast [@targettarget, harm, exists][harm] Concussion Blow", "note": ""}]}, {"type": "Panic / defensive", "macros": [{"name": "Shield Block", "code": "#showtooltip Shield Block\n/cast Shield Block", "note": ""}, {"name": "Last Stand", "code": "#showtooltip Last Stand\n/cast Last Stand", "note": ""}]}]}]}], "order": ["TT-aware DPS", "Mouseover healing / utility", "Cleanse / dispel", "Wand / auto-attack", "Buffs", "Panic / defensive", "Targeting helpers", "Class QoL", "Focus", "Misc / UI"], "patterns": [{"name": "TT-aware DPS", "code": "#showtooltip SPELL\n/cast [@targettarget, harm, exists][harm] SPELL"}, {"name": "Mouseover heal / utility", "code": "#showtooltip SPELL\n/cast [@mouseover, help, exists][help] SPELL"}, {"name": "Friend-or-foe (Dispel Magic)", "code": "#showtooltip SPELL\n/cast [@mouseover, exists][exists] SPELL"}, {"name": "Buffs (adds self fallback)", "code": "#showtooltip SPELL\n/cast [@mouseover, help, exists][help][@player] SPELL"}, {"name": "Spam-safe channel", "code": "#showtooltip SPELL\n/cast [@targettarget, harm, exists, nochanneling][harm, nochanneling] SPELL"}, {"name": "Wand", "code": "#showtooltip Shoot\n/cast [@targettarget, harm, exists, nochanneling:Shoot] Shoot\n/cast [harm, nochanneling:Shoot] Shoot"}]};
const ALL = [D.universal, ...D.classes];
let cls = D.classes[0].name, spec = "All";

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const byOrder = gs => [...gs].sort((a,b)=>D.order.indexOf(a.type)-D.order.indexOf(b.type));

function macroHTML(m){
  if(!m.code) return `<div class="macro"><div class="note">${esc(m.note)}</div></div>`;
  return `<div class="macro"><div class="top"><div><div class="name">${esc(m.name)}</div>${m.note?`<div class="note">${esc(m.note)}</div>`:""}</div>
  <button class="copy" data-code="${esc(m.code)}">Copy</button></div><pre>${esc(m.code)}</pre></div>`;
}

function groupHTML(g){
  return `<details class="section" open><summary><span class="toggle" aria-hidden="true"></span>${esc(g.type)}</summary><div class="section-body">${g.macros.map(macroHTML).join("")}</div></details>`;
}

const CLASS_ICONS = {
  Priest: "https://wow.zamimg.com/images/wow/icons/large/classicon_priest.jpg",
  Shaman: "https://wow.zamimg.com/images/wow/icons/large/classicon_shaman.jpg",
  Paladin: "https://wow.zamimg.com/images/wow/icons/large/classicon_paladin.jpg",
  Warlock: "https://wow.zamimg.com/images/wow/icons/large/classicon_warlock.jpg",
  Hunter: "https://wow.zamimg.com/images/wow/icons/large/classicon_hunter.jpg",
  Warrior: "https://wow.zamimg.com/images/wow/icons/large/classicon_warrior.jpg",
  Universal: "assets/universal-icon.webp",
};
function renderRoster(){
  roster.innerHTML = ALL.map(c=>{
    const icon = CLASS_ICONS[c.name];
    const img = icon ? `<img class="class-icon" src="${icon}" alt="" loading="lazy">` : "";
    return `<button style="--c:${c.color}" aria-pressed="${c.name===cls}" data-c="${c.name}">${img}${esc(c.name)}</button>`;
  }).join("");
}
function renderSpecs(c){
  if(c.name==="Universal"){specs.innerHTML="";return;}
  const opts=["All",...c.sections.map(s=>s.spec)];
  specs.innerHTML = opts.map(s=>`<button aria-pressed="${s===spec}" data-s="${s}">${s==="Shared"?"Shared (all specs)":s==="All"?"Everything":s}</button>`).join("");
}
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let html = "";
  if(q){
    document.documentElement.style.setProperty("--accent","#FFD100");
    roster.style.opacity=.5; specs.innerHTML="";
    for(const c of ALL) for(const s of c.sections) for(const g of s.groups){
      const hits = g.macros.filter(m=>(m.name+" "+m.code+" "+g.type+" "+c.name+" "+s.spec).toLowerCase().includes(q) && m.code);
      if(hits.length) html += groupHTML({type: `${c.name} · ${s.spec} — ${g.type}`, macros: hits});
    }
    out.innerHTML = html || `<p class="empty">No macro matches “${esc(q)}”. Try a spell name like Flash Heal or a type like focus.</p>`;
    return;
  }
  roster.style.opacity=1;
  const c = ALL.find(x=>x.name===cls);
  document.documentElement.style.setProperty("--accent", c.color);
  renderRoster(); renderSpecs(c);
  if(c.name==="Universal"){
    html += `<h2>Style patterns</h2><div class="patterns">`+D.patterns.map(p=>macroHTML({name:p.name,code:p.code,note:""})).join("")+`</div>`;
  }
  for(const s of c.sections){
    if(spec!=="All" && s.spec!==spec) continue;
    html += `<h2>${esc(c.name==="Universal"?"All classes":s.spec==="Shared"?c.name+" — shared by every spec":c.name+" — "+s.spec)}</h2>`;
    for(const g of byOrder(s.groups)) html += groupHTML(g);
  }
  out.innerHTML = html;
}
roster.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cls=b.dataset.c;spec="All";document.getElementById("q").value="";render();});
specs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;spec=b.dataset.s;render();});
document.getElementById("q").addEventListener("input",render);
out.addEventListener("click",async e=>{
  const b=e.target.closest(".copy"); if(!b) return;
  try{await navigator.clipboard.writeText(b.dataset.code);}
  catch{const t=document.createElement("textarea");t.value=b.dataset.code;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}
  b.textContent="Copied";b.classList.add("done");setTimeout(()=>{b.textContent="Copy";b.classList.remove("done")},1200);
});
renderRoster(); render();
</script>
</body>
