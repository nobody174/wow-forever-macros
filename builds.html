<style>
:root{
  --bg:#0E1428; --panel:#161E38; --edge:#3A4468; --gold:#FFD100;

  --serif:"Marcellus","Palatino Linotype",Georgia,serif;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

.topbar nav a{font:500 14px var(--sans);color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:4px;border:1px solid transparent}
.topbar nav a:hover{color:var(--text);border-color:var(--edge)}
.topbar nav a[aria-current="page"]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.wrap{max-width:980px;margin:0 auto;padding:80px 20px;text-align:center}
h1{font:400 clamp(28px,5vw,44px)/1.1 var(--serif);color:var(--gold);margin:0 0 12px;letter-spacing:.01em}
